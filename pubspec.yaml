name: friendsride_app
description: "O aplicație modernă de ride-sharing pentru România cu design premium și funcționalități avansate."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Core UI & State Management
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  
  # Voice AI & Speech (WORKING)
  flutter_tts: ^3.8.5
  speech_to_text: ^7.3.0
  google_generative_ai: ^0.4.0
  
  # Network & Data
  http: ^1.1.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  
  # Location & Maps
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  mapbox_maps_flutter: ^2.10.0
  
  # System Information & Monitoring
  device_info_plus: ^11.5.0
  connectivity_plus: ^6.0.3
  sentry_flutter: ^7.20.0
  
  # Database & Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Scheduling
  cron: ^0.6.0
  add_2_calendar: ^3.0.0
  
  # Firebase
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.1
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  
  # Social Login
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  flutter_facebook_auth: ^7.1.2
  
  # Firebase Real-time & Messaging
  firebase_analytics: ^12.0.0
  cloud_functions: ^6.0.0
  firebase_crashlytics: ^5.0.0
  
  # Maps Alternative (WORKING)
  google_maps_flutter: ^2.5.0
  geocoding: ^4.0.0
  
  # Utility & UI
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.0
  share_plus: ^11.1.0
  uuid: ^4.3.3
  crypto: ^3.0.3
  image_picker: ^1.1.2
  file_picker: ^10.3.2
  audioplayers: ^6.0.0
  record: ^6.1.2
  emoji_picker_flutter: ^2.0.0
  wakelock_plus: ^1.1.4
  
  # PDF & Printing
  pdf: ^3.11.0
  printing: ^5.13.1
  flutter_local_notifications: ^19.4.1
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  
  # Linting & Code Quality
  flutter_lints: ^6.0.0
  
  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  firebase_core_platform_interface: ^6.0.0

# App Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#1976D2"
    theme_color: "#1976D2"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

# Flutter Configuration
flutter:
  uses-material-design: true
  generate: true

  assets:
    # Declararea folderelor principale de resurse
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - assets/audio/
    - assets/data/
    - assets/poi/
    # NOU: Adăugat folder pentru sunetele de notificare
    - assets/sounds/

  # fonts eliminate temporar pentru testare automată

flutter_native_splash:
  color: "#3682F3"
  # Removed image to avoid showing a pin on splash
  android_12:
    color: "#3682F3"
    # Removed image on Android 12 splash as well
  ios: true
  web: false